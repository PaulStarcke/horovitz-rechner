<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15324b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Horovitz"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="icon" type="image/png" href="./icon-192.png"><title>Horovitz-Rechner</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f3f6f9;color:#172b3b;margin:0;padding:18px}main{max-width:520px;margin:auto}h1{font-size:1.55rem}section{background:white;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #1232}label{display:block;margin:14px 0;font-weight:600}input,select,button{font:inherit;box-sizing:border-box}input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #aab6c1;border-radius:9px;background:white}button{padding:12px;border:1px solid #57748c;border-radius:9px;background:white;cursor:pointer}button[aria-pressed=true]{background:#15324b;color:white}.row{display:flex;gap:8px}.row button{flex:1}#result{font-size:3.6rem;font-weight:750}small,.muted{color:#526777;line-height:1.5}.hidden{display:none}.error{color:#a52020}footer{font-size:.82rem;line-height:1.5}</style></head><body><main><h1>Horovitz-Rechner</h1><p class="muted">PaO₂ / FiO₂ · offline nutzbar</p><div class="row"><button id="vent" aria-pressed="true">Beatmet</button><button id="spont" aria-pressed="false">Nicht beatmet</button></div><section><label>PaO₂ (mmHg)<input id="pao" type="number" min="1" max="800" step="any" value="80"></label><div id="ventfields"><label>FiO₂ (%)<input id="fio" type="number" min="21" max="100" step="any" value="40"></label></div><div id="spontfields" class="hidden"><label>Sauerstoffgabe<select id="device"><option value="room">Raumluft</option><option value="nasal">Nasenbrille</option><option value="mask">Einfache O₂-Maske</option></select></label><label id="flowlabel" class="hidden">O₂-Fluss (L/min)<input id="flow" type="number" min="0" max="10" step="any" value="2"></label></div><p id="error" class="error" role="alert"></p></section><section><div class="muted">Horovitz-Quotient</div><div id="result" aria-live="polite">200</div><div id="detail" class="muted"></div><p id="category"></p></section><footer><p id="note"></p><p>Orientierungsgrenzen: ≤100, 101–200, 201–300, &gt;300 mmHg. Der Quotient allein erlaubt keine ARDS-Diagnose. FiO₂-Schätzungen bei spontaner Atmung sind unsicher und nicht für Therapieentscheidungen allein geeignet.</p></footer></main><script>(()=>{const q=id=>document.getElementById(id);let mode='vent';function update(){const v=mode==='vent';q('ventfields').classList.toggle('hidden',!v);q('spontfields').classList.toggle('hidden',v);q('vent').setAttribute('aria-pressed',v);q('spont').setAttribute('aria-pressed',!v);const d=q('device').value;q('flowlabel').classList.toggle('hidden',d==='room');const p=Number(q('pao').value),f=Number(q('fio').value),l=Number(q('flow').value);let err='',fi;if(!q('pao').value||!Number.isFinite(p)||p<=0||p>800)err='PaO₂ muss zwischen 1 und 800 mmHg liegen.';if(v){fi=f/100;if(!q('fio').value||!Number.isFinite(f)||f<21||f>100)err='FiO₂ muss zwischen 21 und 100 % liegen.';}else if(d==='room')fi=.21;else{if(!q('flow').value||!Number.isFinite(l)||l<0||l>10)err='Fluss muss zwischen 0 und 10 L/min liegen.';if(d==='mask'&&l<5)err='Einfache Maske: mindestens 5 L/min erforderlich (CO₂-Rückatmung).';fi=d==='nasal'?Math.min(.60,.21+.04*l):(l<5?.40:Math.min(.60,.40+.04*(l-5)));}q('error').textContent=err;if(err){q('result').textContent='–';q('detail').textContent='Eingaben prüfen';q('category').textContent='';return;}const x=p/fi;q('result').textContent=Math.round(x).toLocaleString('de-DE');q('detail').textContent=p.toLocaleString('de-DE')+' mmHg / '+fi.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' = '+Math.round(x)+' mmHg'+(!v&&d!=='room'?' · FiO₂ geschätzt':'');q('category').textContent='Orientierungsbereich: '+(x<=100?'≤100':x<=200?'101–200':x<=300?'201–300':'>300')+' mmHg';q('note').textContent=v?'FiO₂ ist der eingestellte Wert.':d==='room'?'Raumluft: FiO₂ = 21 %.':d==='nasal'?'Nasenbrille: vereinfachte Schätzung 21 % + 4 Prozentpunkte je L/min, maximal 60 %.':'Einfache Maske: rein rechnerisches Schätzschema 40 % bis 5 L/min, danach +4 Prozentpunkte je L/min, maximal 60 %. Unter 5 L/min besteht CO₂-Rückatmungsgefahr: nicht so betreiben.';}q('vent').addEventListener('click',()=>{mode='vent';update()});q('spont').addEventListener('click',()=>{mode='spont';update()});document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',update));update()})();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
